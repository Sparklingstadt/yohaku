# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# 本番: DATABASE_URL があれば PostgreSQL（Supabase など）、なければ SQLite。
# Vercel のコンテナはインスタンスごとに別ディスクなので、会員・注文データを
# 保持するには DATABASE_URL の設定が必要（bin/vercel-start 参照）。
production:
<% if ENV["DATABASE_URL"].present? %>
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
  schema_search_path: <%= ENV.fetch("DATABASE_SCHEMA", "public") %>
<% else %>
  <<: *default
  database: <%= ENV.fetch("SQLITE_DATABASE_PATH", "storage/production.sqlite3") %>
<% end %>
